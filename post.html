<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 · oxoxox-oxox</title>
    <link rel="stylesheet" href="style.css">
    <!-- 1. 引入极速的 Markdown 解析库 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="page-wrapper">
        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="index.html" class="nav-brand">oxoxox-oxox's ink</a>
            <div class="nav-menu">
                <a href="blog.html" class="nav-link active">Blog</a>
                <a href="index.html" class="nav-link">About</a>
            </div>
        </nav>

        <!-- 文章主体容器 -->
        <main class="post-container">
            <!-- 返回博客列表的小按钮 -->
            <a href="blog.html" class="back-link">← 返回博客列表</a>
            
            <!-- 文章真实内容将由 JS 动态插入到这个 div 中 -->
            <article id="article-content" class="markdown-body">
                <p class="loading-text">正在加载文章...</p>
            </article>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>© 2026 oxoxox-oxox · Built with HTML/CSS/JS</p>
        </footer>
    </div>

    <!-- 2. 核心脚本：动态拉取并解析 Markdown -->
    <script>
        // A. 从网址栏解析参数：获取 ?post=后面的文件名
        const urlParams = new URLSearchParams(window.location.search);
        const postName = urlParams.get('post');
        const contentDiv = document.getElementById('article-content');

        if (postName) {
            // B. 用 fetch() 请求 posts 目录下的对应 .md 文件
            fetch(`posts/${postName}.md`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('文章不存在或已被移动');
                    }
                    return response.text(); // 获取 Markdown 纯文本
                })
                .then(markdownText => {
                    // C. 调用 marked.parse() 把 Markdown 转为 HTML，并填入页面！
                    contentDiv.innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    contentDiv.innerHTML = `
                        <h2>404 - 无法找到该文章</h2>
                        <p>请检查 <code>posts/${postName}.md</code> 文件是否存在。</p>
                    `;
                });
        } else {
            contentDiv.innerHTML = '<h2>请指定要阅读的文章</h2>';
        }
    </script>
</body>

</html>
